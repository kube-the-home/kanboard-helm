# -- Docker image configuration for Kanboard
image:
  # -- Docker registry to pull the image from
  registry: "docker.io"
  # -- Docker image repository
  repository: "kanboard/kanboard"
  # -- Image tag (version) to use
  tag: "v1.2.58" # renovate docker docker.io/kanboard/kanboard
  # -- Image pull policy (IfNotPresent, Always, Never)
  pullPolicy: "IfNotPresent"

# -- Secrets for pulling the image from a private registry
# Example:
# imagePullSecrets:
#   - name: regcred
imagePullSecrets: []

# -- Number of old ReplicaSets to retain for rollback
revisionHistoryLimit: 1

# -- Annotations to add to the Kanboard pod
podAnnotations: {}

# -- Node labels for pod assignment
# Example:
# nodeSelector:
#   kubernetes.io/arch: amd64
nodeSelector: {}

# -- Tolerations for pod assignment
tolerations: []

# -- Affinity rules for pod assignment
affinity: {}

# -- Typed Kanboard configuration, rendered to the upstream environment variables.
# Values left at `~` (null) or "" are not rendered, so Kanboard's own defaults apply.
# Variables set in application.env are rendered after these and take precedence.
# Passwords are never set in plain text; reference an existing Secret via existingSecret.
config:
  # -- Database configuration (DB_*)
  database:
    # -- Database driver: sqlite, mysql or postgres (upstream default: sqlite)
    driver: ~
    # -- Database hostname (mysql/postgres)
    hostname: ~
    # -- Database port (mysql/postgres)
    port: ~
    # -- Database name
    name: ~
    # -- Database username
    username: ~
    # -- Existing Secret holding the database password
    existingSecret:
      # -- Name of the existing Secret
      name: ~
      # -- Key inside the existing Secret
      key: password
    # -- Run database migrations automatically on startup (upstream default: true)
    runMigrations: ~

  # -- Mail configuration (MAIL_*). The official image has no working sendmail,
  # so use the smtp transport.
  mail:
    # -- Sender address for notifications
    from: ~
    # -- Mail transport: smtp, sendmail or mail
    transport: ~
    smtp:
      # -- SMTP server hostname
      hostname: ~
      # -- SMTP server port (upstream default: 25)
      port: ~
      # -- SMTP username
      username: ~
      # -- Existing Secret holding the SMTP password
      existingSecret:
        # -- Name of the existing Secret
        name: ~
        # -- Key inside the existing Secret
        key: password
      # -- SMTP encryption: ssl or tls
      encryption: ~

  # -- LDAP authentication (LDAP_*)
  ldap:
    # -- Enable LDAP authentication
    enabled: ~
    # -- LDAP server, e.g. ldap.example.com or ldaps://ldap.example.com
    server: ~
    # -- LDAP port (upstream default: 389)
    port: ~
    # -- Verify the server certificate for ldaps (upstream default: true)
    sslVerify: ~
    # -- Use STARTTLS
    startTls: ~
    # -- Treat usernames as case sensitive
    usernameCaseSensitive: ~
    # -- Bind type: anonymous, user or proxy (upstream default: anonymous)
    bindType: ~
    # -- Bind username (proxy) or username pattern (user), e.g. cn=%s,dc=example,dc=com
    username: ~
    # -- Existing Secret holding the bind password
    existingSecret:
      # -- Name of the existing Secret
      name: ~
      # -- Key inside the existing Secret
      key: password
    # -- Base DN for user lookups
    userBaseDn: ~
    # -- User filter, e.g. (&(objectClass=user)(sAMAccountName=%s))
    userFilter: ~
    # -- LDAP attribute mapping
    userAttributes:
      # -- Username attribute (upstream default: uid)
      username: ~
      # -- Full name attribute (upstream default: cn)
      fullname: ~
      # -- Email attribute (upstream default: mail)
      email: ~
      # -- Group membership attribute (upstream default: memberof)
      groups: ~
      # -- Profile photo attribute
      photo: ~
      # -- Language attribute
      language: ~
    # -- Create Kanboard users automatically on first LDAP login (upstream default: true)
    userCreation: ~
    # -- Give new LDAP users the manager role by default
    userDefaultRoleManager: ~
    # -- DN of the group whose members become Kanboard admins
    groupAdminDn: ~
    # -- DN of the group whose members become Kanboard managers
    groupManagerDn: ~
    # -- Enable the LDAP group provider
    groupProvider: ~
    # -- Base DN for group lookups
    groupBaseDn: ~
    # -- Group filter
    groupFilter: ~
    # -- Filter to find the groups of a user
    groupUserFilter: ~
    # -- User attribute used in groupUserFilter (upstream default: username)
    groupUserAttribute: ~
    # -- Group name attribute (upstream default: cn)
    groupAttributeName: ~
    # -- Synchronize groups on login (upstream default: true)
    groupSync: ~

  # -- Reverse proxy authentication (REVERSE_PROXY_*), e.g. behind oauth2-proxy or Authelia
  reverseProxy:
    # -- Enable reverse proxy authentication
    enabled: ~
    # -- Header containing the username (upstream default: REMOTE_USER)
    userHeader: ~
    # -- Header containing the email address (upstream default: REMOTE_EMAIL)
    emailHeader: ~
    # -- Header containing the full name (upstream default: REMOTE_NAME)
    fullnameHeader: ~
    # -- Username that becomes admin
    defaultAdmin: ~
    # -- Default email domain for new users
    defaultDomain: ~

# -- Application configuration
application:
  # -- Port on which Kanboard listens inside the container
  port: 80
  # -- Additional labels to add to the deployment
  additionalLabels: {}
  # -- Persistence configuration for Kanboard data
  persistence:
    # -- Enable persistent storage for Kanboard data
    enabled: false
    persistentVolumeClaim:
      # -- Name of the PersistentVolumeClaim
      name: kanboard-pvc
      # -- Create a new PVC (set to false to use an existing PVC)
      create: true
      # -- Storage class to use for the PVC
      storageClass: default
      # -- Size of the persistent volume
      size: 5Gi
      # -- Access mode for the persistent volume (ReadWriteOnce, ReadWriteMany, ReadOnlyMany)
      accessMode: ReadWriteMany
  # -- Additional environment variables for the Kanboard container
  # Example:
  # env:
  #   - name: DEBUG
  #     value: "true"
  env: []

# -- Health probes for the Kanboard container. Upstream exposes /healthcheck.php
# (since Kanboard 1.2.46), which returns 200 when the database connection is OK
# and 503 otherwise. Every key except `enabled` is passed through as the probe spec.
probes:
  # -- Startup probe, gives database migrations time to finish on first boot
  startup:
    enabled: true
    httpGet:
      path: /healthcheck.php
      port: http
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 30
  # -- Liveness probe, restarts the container when Kanboard stops responding
  liveness:
    enabled: true
    httpGet:
      path: /healthcheck.php
      port: http
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  # -- Readiness probe, removes the pod from the Service while the database is unreachable
  readiness:
    enabled: true
    httpGet:
      path: /healthcheck.php
      port: http
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# -- Kubernetes Service configuration
service:
  # -- Enable service creation, will also be created if ingress or route is enabled
  enabled: false
  # -- Service type (ClusterIP, NodePort, LoadBalancer)
  type: ClusterIP
  # -- Service port
  port: 8080
  # -- NodePort (only used when type is NodePort)
  nodePort: ~

# -- Ingress configuration for exposing Kanboard externally
ingress:
  # -- Enable ingress creation
  enabled: false
  # -- Annotations for the ingress resource (e.g., cert-manager, auth)
  annotations: {}
  # -- Ingress class name to use (e.g., nginx, traefik)
  ingressClassName: "nginx"
  # -- Hostname for the ingress
  host: ~
  # -- TLS configuration for the ingress
  # Example:
  # tls:
  #   - secretName: kanboard-tls
  #     hosts:
  #       - kanboard.example.com
  tls: ~

# -- Gateway API HTTPRoute configuration (alternative to Ingress)
route:
  # -- Enable HTTPRoute creation
  enabled: false
  # -- Annotations for the HTTPRoute resource
  annotations: {}
  # -- Labels for the HTTPRoute resource
  labels: {}
  # -- Hostnames to match for routing
  hostnames: []
  # -- Parent references (Gateway references)
  # Example:
  # parentRefs:
  #   - name: gateway-name
  #     namespace: gateway-namespace
  parentRefs: []

# -- Security context configuration
securityContext:
  # -- Pod-level security context
  # Example:
  # pod:
  #   fsGroup: 2000
  #   runAsNonRoot: true
  pod: ~
  # -- Container-level security context
  # Example:
  # container:
  #   allowPrivilegeEscalation: false
  #   runAsUser: 1000
  container: ~

# -- Resource requests and limits for the Kanboard container
# Example:
# resources:
#   limits:
#     cpu: 500m
#     memory: 512Mi
#   requests:
#     cpu: 250m
#     memory: 256Mi
resources: ~
